<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Fratelos — Vol. 1</title>
<meta name="description" content="Los Fratelos, Vol. 1. Síguenos en Instagram @losfratelosofficial">
<link rel="icon" href="./mascota.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#141210;
    --red:#d81f1f;
    --paper:#ffffff;
    --grey:#8a8378;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--black);
    font-family:'Oswald', sans-serif;
    min-height:100%;
  }

  .stage{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 6vw;
  }

  .poster{
    width:min(92vw, 760px);
    display:flex;
    flex-direction:column;
    align-items:center;
    animation: rise 1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .fecha-top{
    font-family:'UnifrakturMaguntia', cursive;
    font-size: clamp(1.6rem, 4.2vw, 2.6rem);
    color: var(--black);
    line-height:1;
    margin-bottom: clamp(-0.5rem, -1vw, 0rem);
    z-index:2;
  }

  .fila{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: clamp(0.5rem, 3vw, 2rem);
  }

  .fecha-lado{
    font-family:'UnifrakturMaguntia', cursive;
    font-size: clamp(1.4rem, 3.6vw, 2.3rem);
    color: var(--black);
    flex-shrink:0;
    line-height:1;
  }

  .titulo{
    width: min(64vw, 480px);
    height:auto;
    flex-shrink:1;
  }

  .ig-tag{
    margin-top: clamp(1.2rem, 3.5vw, 2rem);
    display:inline-flex;
    align-items:center;
    gap:0.6rem;
    padding: 0.7rem 1.9rem;
    border: 2px solid var(--red);
    color: var(--black);
    text-decoration:none;
    font-weight:600;
    font-size: clamp(0.95rem, 2.1vw, 1.15rem);
    letter-spacing:0.03em;
    background: transparent;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .ig-tag:hover, .ig-tag:focus-visible{
    background: var(--red);
    color: var(--paper);
    transform: translateY(-2px);
  }

  .ig-tag:focus-visible{
    outline: 2px solid var(--black);
    outline-offset: 4px;
  }

  .ig-tag svg{
    width:1.15em;
    height:1.15em;
    flex-shrink:0;
  }

  footer{
    margin-top: clamp(2rem, 6vh, 3rem);
    font-size:0.75rem;
    color: var(--grey);
    letter-spacing:0.06em;
  }

  @media (prefers-reduced-motion: reduce){
    .poster{ animation:none; }
  }
</style>
</head>
<body>

  <main class="stage">
    <div class="poster">
      <span class="fecha-top">Octubre</span>

      <div class="fila">
        <span class="fecha-lado">??</span>
        <img class="titulo" src="./titulo.png" alt="Los Fratelos — Vol. 1">
        <span class="fecha-lado">26</span>
      </div>

      <a
        class="ig-tag"
        href="https://www.instagram.com/losfratelosofficial/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Síguenos en Instagram, arroba losfratelosofficial"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.2" cy="6.8" r="1"></circle>
        </svg>
        <span>@losfratelosofficial</span>
      </a>
    </div>

    <footer>Made by avS</footer>
  </main>

</body>
</html>
