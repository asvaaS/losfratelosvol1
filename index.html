<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Fratelos — Vol. 1</title>
<meta name="description" content="Los Fratelos, Vol. 1. Síguenos en Instagram @losfratelosofficial">
<link rel="icon" href="./assets/mascota.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0908;
    --near-black:#141210;
    --red:#d81f1f;
    --red-dim:#7a1414;
    --bone:#efe9df;
    --bone-dim:#a89f8f;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--black);
    color:var(--bone);
    font-family:'Oswald', sans-serif;
    height:100%;
    overflow-x:hidden;
  }

  /* subtle grain / concrete texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:2;
    opacity:0.05;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0.5px, transparent 0.5px),
      radial-gradient(circle at 60% 70%, #fff 0.5px, transparent 0.5px),
      radial-gradient(circle at 80% 20%, #fff 0.5px, transparent 0.5px);
    background-size: 3px 3px, 5px 5px, 4px 4px;
  }

  .stage{
    position:relative;
    min-height:100svh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 6vh 6vw 8vh;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, rgba(216,31,31,0.10), transparent 65%),
      linear-gradient(180deg, #050505 0%, #0a0908 55%, #050505 100%);
  }

  .mascota{
    position:absolute;
    left:50%;
    bottom:6%;
    transform:translateX(-50%);
    width:min(46vw, 420px);
    opacity:0.10;
    filter: saturate(0) brightness(0) invert(1);
    z-index:0;
    user-select:none;
    pointer-events:none;
  }

  .marco{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(2rem, 5vw, 3.5rem);
    animation: rise 1.1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .titulo{
    width: min(88vw, 560px);
    height:auto;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }

  .ig-tag{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:0.65rem;
    padding: 0.85rem 2.1rem;
    border: 2px solid var(--red);
    color: var(--bone);
    text-decoration:none;
    font-weight:600;
    font-size: clamp(1rem, 2.3vw, 1.25rem);
    letter-spacing:0.04em;
    background: rgba(216,31,31,0.06);
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .ig-tag:hover, .ig-tag:focus-visible{
    background: var(--red);
    color: var(--black);
    transform: translateY(-2px);
  }

  .ig-tag:focus-visible{
    outline: 2px solid var(--bone);
    outline-offset: 4px;
  }

  .ig-tag svg{
    width:1.2em;
    height:1.2em;
    flex-shrink:0;
  }

  .ig-tag .handle-line{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.05;
  }

  .ig-tag .eyebrow{
    font-size:0.6em;
    color: var(--bone-dim);
    font-weight:500;
    letter-spacing:0.14em;
  }

  .ig-tag:hover .eyebrow, .ig-tag:focus-visible .eyebrow{
    color: rgba(10,9,8,0.7);
  }

  footer{
    position:relative;
    z-index:1;
    margin-top: clamp(2rem, 6vh, 3rem);
    font-size:0.78rem;
    color: var(--bone-dim);
    letter-spacing:0.06em;
  }

  @media (prefers-reduced-motion: reduce){
    .marco{ animation:none; }
  }
</style>
</head>
<body>

  <main class="stage">
    <img class="mascota" src="./assets/mascota.png" alt="" aria-hidden="true">

    <div class="marco">
      <img class="titulo" src="./assets/titulo.png" alt="Los Fratelos — Vol. 1">

      <a
        class="ig-tag"
        href="https://www.instagram.com/losfratelosofficial/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Síguenos en Instagram, arroba losfratelosofficial"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.2" cy="6.8" r="1"></circle>
        </svg>
        <span class="handle-line">
          <span class="eyebrow">Síguenos</span>
          <span>@losfratelosofficial</span>
        </span>
      </a>
    </div>

    <footer>Los Fratelos</footer>
  </main>

</body>
</html>
