<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Fratelos — Vol. 1</title>
<meta name="description" content="Los Fratelos, Vol. 1. Síguenos en Instagram @losfratelosofficial">
<link rel="icon" href="./mascota.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#141210;
    --red:#d81f1f;
    --paper:#ffffff;
    --grey:#8a8378;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--black);
    font-family:'Oswald', sans-serif;
    min-height:100%;
  }

  .gif-corner{
    position: fixed;
    top: 0;
    left: 0;
    width: clamp(72px, 11vw, 140px);
    height: auto;
    z-index: 5;
    pointer-events: none;
  }

  .stage{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 6vw;
  }

  .poster{
    width:min(96vw, 920px);
    display:flex;
    flex-direction:column;
    align-items:center;
    animation: rise 1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .fecha-top{
    font-family:'UnifrakturMaguntia', cursive;
    font-size: clamp(2rem, 5.2vw, 3.2rem);
    color: var(--black);
    line-height:1;
    margin-bottom: clamp(1.2rem, 3vw, 2rem);
    z-index:2;
  }

  .fila{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: clamp(0.5rem, 3vw, 2rem);
  }

  .fecha-lado{
    font-family:'UnifrakturMaguntia', cursive;
    font-size: clamp(1.8rem, 4.6vw, 3rem);
    color: var(--black);
    flex-shrink:0;
    line-height:1;
  }

  .titulo{
    width: min(60vw, 460px);
    height:auto;
    flex-shrink:1;
  }

  .ig-tag{
    margin-top: clamp(1.2rem, 3.5vw, 2rem);
    display:inline-flex;
    align-items:center;
    gap:0.6rem;
    padding: 0.7rem 1.9rem;
    border: 2px solid var(--red);
    color: var(--black);
    text-decoration:none;
    font-weight:600;
    font-size: clamp(0.95rem, 2.1vw, 1.15rem);
    letter-spacing:0.03em;
    background: transparent;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .ig-tag:hover, .ig-tag:focus-visible{
    background: var(--red);
    color: var(--paper);
    transform: translateY(-2px);
  }

  .ig-tag:focus-visible{
    outline: 2px solid var(--black);
    outline-offset: 4px;
  }

  .ig-tag svg{
    width:1.15em;
    height:1.15em;
    flex-shrink:0;
  }

  .tracklist{
    width:min(96vw, 920px);
    margin-top: clamp(3rem, 7vh, 4.5rem);
  }

  .tracklist h2{
    margin:0 0 clamp(1.2rem, 3vw, 1.8rem);
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    font-weight:600;
    letter-spacing:0.05em;
    text-align:center;
  }

  .track-grid{
    display:flex;
    flex-wrap:wrap;
    gap: clamp(0.9rem, 2.4vw, 1.4rem);
  }

  .track-card{
    background: #000000;
    border-radius: 14px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    flex: 1 1 130px;
    min-width:130px;
    max-width:200px;
  }

  .track-cover{
    aspect-ratio: 1 / 1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #121212;
    font-family:'UnifrakturMaguntia', cursive;
    font-size: clamp(2.2rem, 6vw, 3rem);
    color: var(--grey);
  }

  .track-info{
    padding: 0.75rem 0.7rem 0.9rem;
    display:flex;
    flex-direction:column;
    gap:0.3rem;
  }

  .track-title{
    color: var(--paper);
    font-size: clamp(0.78rem, 1.9vw, 0.9rem);
    font-weight:600;
    line-height:1.25;
  }

  .track-meta{
    color: #8f887c;
    font-size: clamp(0.66rem, 1.6vw, 0.74rem);
    letter-spacing:0.01em;
  }

  .track-status{
    margin-top:0.35rem;
    color: var(--red);
    font-size: clamp(0.62rem, 1.5vw, 0.7rem);
    font-weight:700;
    letter-spacing:0.08em;
  }

  footer{
    margin-top: clamp(3rem, 8vh, 5rem);
    font-size:0.75rem;
    color: var(--grey);
    letter-spacing:0.06em;
  }

  @media (prefers-reduced-motion: reduce){
    .poster{ animation:none; }
  }
</style>
</head>
<body>

      <a

    <section class="tracklist">

        <div class="track-card">

    <footer>Made by avS</footer>
  </main>

</body>
</html>
