<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Fratelos — Vol. 1</title>
<meta name="description" content="Los Fratelos, Vol. 1. Síguenos en Instagram @losfratelosofficial">
<link rel="icon" type="image/png" href="mascota.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #141210;
    --red: #d81f1f;
    --paper: #ffffff;
    --grey: #8a8378;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--black);
    font-family: 'Oswald', sans-serif;
    min-height: 100%;
  }

  .gif-corner {
    position: fixed;
    top: 0;
    left: 0;
    width: clamp(72px, 11vw, 140px);
    height: auto;
    z-index: 5;
    pointer-events: none;
  }

  .stage {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
  }

  .poster {
    width: min(96vw, 920px);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 1s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fecha-top {
    font-family: 'UnifrakturMaguntia', cursive;
    font-size: clamp(2rem, 5.2vw, 3.2rem);
    color: var(--black);
    line-height: 1;
    margin-bottom: clamp(1.2rem, 3vw, 2rem);
    z-index: 2;
  }

  .fila {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(0.5rem, 3vw, 2rem);
  }

  .fecha-lado {
    font-family: 'UnifrakturMaguntia', cursive;
    font-size: clamp(1.8rem, 4.6vw, 3rem);
    color: var(--black);
    flex-shrink: 0;
    line-height: 1;
  }

  .titulo {
    width: min(70vw, 460px); /* Ligeramente ajustado para móviles */
    height: auto;
    flex-shrink: 1;
  }

  .ig-tag {
    margin-top: clamp(1.2rem, 3.5vw, 2rem);
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 1.9rem;
    border: 2px solid var(--red);
    color: var(--black);
    text-decoration: none;
    font-weight: 600;
    font-size: clamp(0.95rem, 2.1vw, 1.15rem);
    letter-spacing: 0.03em;
    background: transparent;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .ig-tag:hover, .ig-tag:focus-visible {
    background: var(--red);
    color: var(--paper);
    transform: translateY(-2px);
  }

  .ig-tag:focus-visible {
    outline: 2px solid var(--black);
    outline-offset: 4px;
  }

  .ig-tag svg {
    width: 1.15em;
    height: 1.15em;
    flex-shrink: 0;
  }

  .tracklist {
    width: min(96vw, 920px);
    margin-top: clamp(3rem, 7vh, 4.5rem);
  }

  .tracklist h2 {
    margin: 0 0 clamp(1.2rem, 3vw, 1.8rem);
    font-size: clamp(1.2rem, 2.4vw, 1.4rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    text-align: center;
  }

  .track-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(1rem, 2.8vw, 1.8rem);
  }

  .track-card {
    background: #000000;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex: 1 1 160px;
    min-width: 140px; /* Reducido un poco para encajar 2 columnas en celulares estándar */
    max-width: 220px;
  }

  .track-cover {
    aspect-ratio: 1 / 1;
    width: 100%;
    overflow: hidden;
  }

  .track-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .track-info {
    padding: 0.75rem 0.7rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .track-title {
    color: var(--paper);
    font-size: clamp(0.78rem, 1.9vw, 0.9rem);
    font-weight: 600;
    line-height: 1.25;
  }

  /* letras "reveladas" del título: neón blanco */
  .track-title .neon-letra {
    color: #ffffff;
    text-shadow:
      0 0 4px #ffffff,
      0 0 9px #ffffff,
      0 0 16px rgba(255,255,255,0.85),
      0 0 28px rgba(255,255,255,0.5);
  }

  /* las X se quedan planas, como texto tachado/oculto */
  .track-title .letra-x {
    color: var(--grey);
  }

  .track-meta {
    color: #8f887c;
    font-size: clamp(0.66rem, 1.6vw, 0.74rem);
    letter-spacing: 0.01em;
  }

  .track-status {
    margin-top: 0.35rem;
    color: var(--red);
    font-size: clamp(0.62rem, 1.5vw, 0.7rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-shadow:
      0 0 4px var(--red),
      0 0 10px var(--red),
      0 0 18px rgba(216,31,31,0.85),
      0 0 32px rgba(216,31,31,0.5);
  }

  footer {
    margin-top: clamp(3rem, 8vh, 5rem);
    font-size: 0.75rem;
    color: var(--grey);
    letter-spacing: 0.06em;
  }

  /* --- POPUP DE CORREO --- */
  .modal-overlay {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 5vw;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.visible { opacity: 1; }

  .modal-box {
    position: relative;
    background: var(--paper);
    border: 2px solid var(--red);
    border-radius: 0;
    max-width: 420px;
    width: 100%;
    padding: 2.4rem 1.8rem 1.9rem;
    text-align: center;
    box-shadow: 0 22px 55px rgba(0,0,0,0.5);
    transform: translateY(14px) scale(0.98);
    transition: transform 0.3s ease;
  }

  .modal-overlay.visible .modal-box {
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    color: var(--black);
    font-size: 1.7rem;
    line-height: 1;
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.2s ease, color 0.2s ease, transform 0.25s ease;
  }

  .modal-close:hover, .modal-close:focus-visible {
    background: var(--red);
    color: var(--paper);
    transform: rotate(90deg);
  }

  .modal-title {
    font-weight: 700;
    font-size: clamp(1.05rem, 4.2vw, 1.35rem);
    line-height: 1.32;
    letter-spacing: 0.01em;
    margin: 0 0 1.5rem;
    color: var(--black);
  }

  .modal-form {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .modal-form input[type="email"] {
    padding: 0.75rem 0.9rem;
    border: 2px solid var(--black);
    background: var(--paper);
    color: var(--black);
    font-family: 'Oswald', sans-serif;
    font-size: 0.92rem;
    width: 100%;
  }

  .modal-form input[type="email"]:focus {
    outline: none;
    border-color: var(--red);
  }

  .modal-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 1.4rem;
    border: 2px solid var(--red);
    color: var(--black);
    background: transparent;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
  }

  .modal-submit:hover, .modal-submit:focus-visible {
    background: var(--red);
    color: var(--paper);
    transform: translateY(-2px);
  }

  .modal-msg {
    display: none;
    font-weight: 600;
    color: var(--red);
    margin: 0;
  }

  .modal-box.sent .modal-form { display: none; }
  .modal-box.sent .modal-msg { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .poster { animation: none; }
  }

  /* --- OPTIMIZACIONES ESPECÍFICAS PARA CELULARES --- */
  @media (max-width: 600px) {
    .fila {
      justify-content: center; /* Evita que las fechas se peguen a los bordes de la pantalla */
      gap: 1rem;
    }

    .titulo {
      width: 55vw; /* Da más protagonismo al título principal */
    }

    .stage {
      padding: 4vh 4vw; /* Reduce un poco el relleno general para ganar espacio en la pantalla */
    }
  }
</style>
</head>
<body>

  <img class="gif-corner" src="./animacion.gif" alt="">

  <main class="stage">
    <div class="poster">
      <span class="fecha-top">Octubre</span>

      <div class="fila">
        <span class="fecha-lado">??</span>
        <img class="titulo" src="./titulo.png" alt="Los Fratelos — Vol. 1">
        <span class="fecha-lado">26</span>
      </div>

      <a
        class="ig-tag"
        href="https://www.instagram.com/losfratelosofficial/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Síguenos en Instagram, arroba losfratelosofficial"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.2" cy="6.8" r="1"></circle>
        </svg>
        <span>@losfratelosofficial</span>
      </a>
    </div>

    <section class="tracklist">
      <h2>Tracklist</h2>
      <div class="track-grid">
        <div class="track-card">
          <div class="track-cover"><img src="./COVER.png" alt="Portada Party LF"></div>
          <div class="track-info">
            <span class="track-title" data-title="Party LF"></span>
            <span class="track-meta">Prod. LF $tudios · 2:38</span>
            <span class="track-status">??/OCTUBRE/2026</span>
          </div>
        </div>
        <div class="track-card">
          <div class="track-cover"><img src="./COVER.png" alt="Portada Ponte Bonita"></div>
          <div class="track-info">
            <span class="track-title" data-title="Ponte Bonita"></span>
            <span class="track-meta">Prod. Zb · 3:58</span>
            <span class="track-status">??/OCTUBRE/2026</span>
          </div>
        </div>
        <div class="track-card">
          <div class="track-cover"><img src="./COVER.png" alt="Portada La Fama"></div>
          <div class="track-info">
            <span class="track-title" data-title="La Fama"></span>
            <span class="track-meta">Prod. LF $tudios · 3:32</span>
            <span class="track-status">??/OCTUBRE/2026</span>
          </div>
        </div>
        <div class="track-card">
          <div class="track-cover"><img src="./COVER.png" alt="Portada Afro LF"></div>
          <div class="track-info">
            <span class="track-title" data-title="Afro LF"></span>
            <span class="track-meta">Prod. LF $tudios · 2:50</span>
            <span class="track-status">??/OCTUBRE/2026</span>
          </div>
        </div>
      </div>
    </section>

    <footer>avS</footer>
  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="Cerrar">&times;</button>
      <p class="modal-title" id="modal-title">TE AVISAMOS CUANDO SALGA LOS FRATELOS VOL. 1?</p>
      <form class="modal-form" id="modal-form" action="https://formspree.io/f/mppwppev" method="POST">
        <input type="email" name="email" placeholder="tu@correo.com" required>
        <button type="submit" class="modal-submit">Enviar</button>
      </form>
      <p class="modal-msg" id="modal-msg">¡Listo!</p>
    </div>
  </div>

  <script>
    // Pinta cada título letra por letra: las X quedan planas, el resto en neón blanco
    var titulos = document.querySelectorAll('.track-title[data-title]');
    for (var i = 0; i < titulos.length; i++) {
      var el = titulos[i];
      var texto = el.getAttribute('data-title');
      var html = '';
      for (var j = 0; j < texto.length; j++) {
        var ch = texto[j];
        if (ch.trim() === '') {
          html += ch;
        } else if (ch.toLowerCase() === 'x') {
          html += '<span class="letra-x">' + ch + '</span>';
        } else {
          html += '<span class="neon-letra">' + ch + '</span>';
        }
      }
      el.innerHTML = html;
    }
  </script>

  <script>
    // Popup de correo
    (function () {
      var overlay = document.getElementById('modal-overlay');
      var box = document.getElementById('modal-box');
      var closeBtn = document.getElementById('modal-close');
      var form = document.getElementById('modal-form');

      function openModal() {
        overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(function () {
          overlay.classList.add('visible');
        });
      }

      function closeModal() {
        overlay.classList.remove('visible');
        document.body.style.overflow = '';
        setTimeout(function () { overlay.style.display = 'none'; }, 300);
      }

      // Se muestra una sola vez por sesión del navegador
      if (!sessionStorage.getItem('lf_popup_shown')) {
        setTimeout(openModal, 900);
        sessionStorage.setItem('lf_popup_shown', '1');
      }

      closeBtn.addEventListener('click', closeModal);

      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('visible')) closeModal();
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = form.querySelector('button');
        btn.disabled = true;

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        }).then(function (res) {
          if (res.ok) {
            box.classList.add('sent');
            setTimeout(closeModal, 1800);
          } else {
            alert('No se pudo enviar, intenta de nuevo.');
            btn.disabled = false;
          }
        }).catch(function () {
          alert('No se pudo enviar, revisa tu conexión e intenta de nuevo.');
          btn.disabled = false;
        });
      });
    })();
  </script>

</body>
</html>
